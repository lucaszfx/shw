<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Translator & Emulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
        }
        #drop-zone {
            border: 2px dashed #666;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #333;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        #drop-zone:hover {
            background-color: #444;
        }
        #drop-zone.dragover {
            background-color: #555;
            border-color: #4CAF50;
        }
        #game-list {
            width: 80%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .play-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .play-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Game Translator & Emulator</h1>

    <div id="drop-zone">
        <p>Drag & Drop ZIP Game File Here or Click to Upload</p>
        <input type="file" id="file-input" accept=".zip" style="display: none;">
    </div>

    <div id="progress-container" style="display:none; width: 80%; max-width: 600px;">
        <p>Uploading & Extracting...</p>
        <progress id="upload-progress" value="0" max="100" style="width:100%"></progress>
    </div>

    <div id="game-list">
        <!-- Games will be listed here -->
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('upload-progress');
        const gameList = document.getElementById('game-list');

        // Load games
        async function loadGames() {
            const res = await fetch('/games');
            const games = await res.json();
            gameList.innerHTML = '';
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>Game ${game.id}</h3>
                    <a href="${game.url}" class="play-btn">Play</a>
                `;
                gameList.appendChild(card);
            });
        }

        loadGames();

        // Drag & Drop handlers
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                uploadFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                uploadFile(fileInput.files[0]);
            }
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            progressContainer.style.display = 'block';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressBar.value = percentComplete;
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    alert('Upload successful!');
                    loadGames();
                } else {
                    alert('Upload failed');
                }
                progressContainer.style.display = 'none';
                progressBar.value = 0;
            };

            xhr.send(formData);
        }
    </script>
</body>
</html>
